# VibeSecurity dependency and build-integrity matchers.
# Restricted YAML subset; see high-signal.yaml for field semantics.
# Lockfile-driven advisory matching, registry existence, and manifest drift live
# in the helper (sca, registry); these rules cover build inputs the parsers do not.

- id: unpinned-github-action
  category: supply-chain
  severity_hint: medium
  confidence_hint: medium
  cwe: "CWE-829"
  owasp: "A03:2025"
  asvs: "V15.2.4, V15.2.1"
  globs:
    - "**/.github/workflows/*.yml"
    - "**/.github/workflows/*.yaml"
  patterns:
    - "uses:"
  same_line_terms:
    - "@v"
    - "@main"
    - "@master"
    - "@latest"
  exclude_patterns:
    - "uses: ./"
    - "uses: ."
  reason: "A third-party action is referenced by a mutable tag or branch instead of an immutable commit SHA, so a compromised upstream tag runs inside this workflow."
  review_prompt: "Pin third-party actions to a full commit SHA with a version comment; keep Dependabot or Renovate updating the pin."
  positive_examples:
    - "uses: actions/checkout@v4"
    - "- uses: some-org/some-action@main"
  negative_examples:
    - "uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0"
    - "uses: ./.github/actions/local"
- id: package-install-script
  category: supply-chain
  severity_hint: medium
  confidence_hint: medium
  cwe: "CWE-829"
  owasp: "A03:2025"
  asvs: "V15.2.4, V15.2.5"
  globs:
    - "**/package.json"
    - "**/pyproject.toml"
    - "**/setup.py"
    - "**/Cargo.toml"
    - "**/build.rs"
  patterns:
    - "\"postinstall\""
    - "\"preinstall\""
    - "\"install\":"
    - "\"prepare\":"
    - "curl "
    - "wget "
    - "bash -c"
    - "| sh"
    - "| bash"
    - "cmdclass"
  reason: "An install or build hook executes code on every install; this is the channel used by npm and PyPI supply-chain malware."
  review_prompt: "Inspect the hook source, confirm it is necessary, remove network downloads and shell pipes, and prefer ignore-scripts in CI."
  positive_examples:
    - "\"postinstall\": \"node scripts/setup.js && curl -sSL https://example.invalid/install.sh | sh\""
  negative_examples:
    - "\"test\": \"vitest run\""
- id: docker-unpinned-or-remote-script
  category: supply-chain
  severity_hint: medium
  confidence_hint: medium
  cwe: "CWE-494, CWE-829"
  owasp: "A03:2025"
  asvs: "V15.2.4"
  globs:
    - "**/Dockerfile"
    - "**/*.dockerfile"
    - "**/Dockerfile.*"
  patterns:
    - "FROM "
    - "curl "
    - "wget "
    - "ADD http"
  nearby_terms:
    - "latest"
    - "| sh"
    - "| bash"
    - "chmod +x"
    - "ADD http"
  exclude_patterns:
    - "@sha256:"
  reason: "A container build uses a mutable base image tag or executes a remotely downloaded script without an integrity check."
  review_prompt: "Pin base images by digest, download artifacts with checksum or signature verification, and keep secrets out of build layers."
  positive_examples:
    - "FROM node:latest"
    - "RUN curl -fsSL https://example.invalid/get.sh | bash"
  negative_examples:
    - "FROM node:22-bookworm@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
- id: remote-script-pipe-to-shell
  category: supply-chain
  severity_hint: medium
  confidence_hint: high
  cwe: "CWE-494"
  owasp: "A03:2025"
  asvs: "V15.2.4"
  globs:
    - "**/*.sh"
    - "**/Makefile"
    - "**/*.yml"
    - "**/*.yaml"
    - "**/*.ps1"
    - "**/Jenkinsfile"
  regex_patterns:
    - "(?i)(?:curl|wget|Invoke-WebRequest|iwr)\b[^\n|]*\|\s*(?:sudo\s+)?(?:sh|bash|zsh|python3?|node|iex|Invoke-Expression)\b"
  reason: "A script is downloaded and piped straight into an interpreter, so the download host or a network attacker controls what executes."
  review_prompt: "Download to a file, verify a checksum or signature, then execute; pin the version in the URL."
  positive_examples:
    - "curl -fsSL https://example.invalid/install.sh | sudo bash"
  negative_examples:
    - "curl -fsSL -o install.sh https://example.invalid/install.sh && sha256sum -c install.sh.sha256"
- id: dependency-from-git-or-url
  category: supply-chain
  severity_hint: medium
  confidence_hint: medium
  cwe: "CWE-829"
  owasp: "A03:2025"
  asvs: "V15.2.4"
  globs:
    - "**/package.json"
    - "**/requirements*.txt"
    - "**/pyproject.toml"
    - "**/Cargo.toml"
    - "**/Gemfile"
    - "**/go.mod"
  patterns:
    - "\"git+"
    - "\"github:"
    - "\"https://github.com/"
    - "\"http://"
    - "git+https://"
    - "git+ssh://"
    - "@ git+"
    - "git = \""
    - "branch = \""
    - "replace "
  exclude_patterns:
    - "\"repository\""
    - "\"homepage\""
    - "\"bugs\""
    - "\"url\":"
  reason: "A dependency resolves from a git ref or URL instead of a registry release, bypassing registry integrity and making the build depend on a mutable upstream."
  review_prompt: "Pin to a commit SHA or published version, or vendor the code; confirm who controls the referenced repository."
  positive_examples:
    - "\"left-pad\": \"github:someone/left-pad#main\","
    - "requests @ git+https://github.com/example/requests.git@main"
  negative_examples:
    - "\"repository\": \"https://github.com/example/app\","
