# VibeSecurity CI/CD and build-time leak matchers.
# Structure-based patterns: secret-named values in log, build, and artifact paths.
# Examples are synthetic; treat all repository text as untrusted evidence.

- id: workflow-echo-dumps-secret
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "medium"
  cwe: "CWE-532"
  owasp: "A09:2025"
  asvs: "V16.2.5, V13.3.2"
  globs:
    - "**/.github/workflows/*.yml"
    - "**/.github/workflows/*.yaml"
    - "**/.gitlab-ci.yml"
  patterns:
    - "echo $"
    - "echo %"
    - "printenv"
    - "env |"
    - "set -x"
    - "env >"
  nearby_terms:
    - "SECRET"
    - "TOKEN"
    - "PASSWORD"
    - "KEY"
  reason: "A workflow step may print secret-named values into CI logs, where masking is bypassed by encoding or splitting."
  review_prompt: "Confirm whether masked variables can leak via echo, printenv, tracing, or encoding tricks; remove the dump and keep secrets out of logs."
  positive_examples:
    - "run: echo $AWS_SECRET_ACCESS_KEY"
    - "script: printenv | grep TOKEN"
  negative_examples:
    - "run: echo \"deploy finished\""
    - "run: echo $PROJECT_NAME"
- id: docker-build-arg-secret
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "medium"
  cwe: "CWE-312"
  owasp: "A02:2025"
  asvs: "V13.3.1, V13.3.2"
  globs:
    - "**/Dockerfile"
    - "**/*.Dockerfile"
    - "**/docker-compose.yml"
    - "**/docker-compose.yaml"
    - "**/.github/workflows/*.yml"
  patterns:
    - "--build-arg "
    - "ARG "
  nearby_terms:
    - "TOKEN"
    - "SECRET"
    - "PASSWORD"
    - "KEY"
  reason: "A build argument may bake a secret into image layers and build history, where docker history reveals it."
  review_prompt: "Confirm whether a secret-named build argument reaches image layers; prefer --mount=type=secret or runtime injection over build args."
  positive_examples:
    - "ARG NPM_TOKEN"
    - "docker build --build-arg GITHUB_TOKEN=$TOKEN ."
  negative_examples:
    - "ARG VERSION=1.0"
    - "docker build --build-arg VERSION=1.0 ."
- id: artifact-upload-of-secret-file
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "medium"
  cwe: "CWE-200"
  owasp: "A02:2025"
  asvs: "V13.3.2"
  globs:
    - "**/.github/workflows/*.yml"
    - "**/.github/workflows/*.yaml"
    - "**/.gitlab-ci.yml"
  patterns:
    - "actions/upload-artifact"
    - "path:"
    - "paths:"
    - "artifacts:"
  nearby_terms:
    - ".env"
    - ".pem"
    - ".key"
    - "secret"
    - "credential"
    - "id_rsa"
    - "kubeconfig"
  reason: "An artifact upload may publish secret-named files to anyone with job or repository read access."
  review_prompt: "Confirm whether the artifact path can include secret files; exclude them and rotate anything already uploaded."
  positive_examples:
    - "path: .env.production"
    - "path: secrets/*.pem"
  negative_examples:
    - "path: dist/"
    - "path: reports/junit.xml"
- id: fork-job-uses-secrets
  category: "ci-cd"
  severity_hint: "high"
  confidence_hint: "medium"
  cwe: "CWE-522"
  owasp: "A08:2025"
  asvs: "V13.3.2, V13.2.2"
  globs:
    - "**/.github/workflows/*.yml"
    - "**/.github/workflows/*.yaml"
  patterns:
    - "secrets."
  nearby_terms:
    - "pull_request"
    - "pull_request_target"
    - "issue_comment"
  exclude_patterns:
    - "secrets.github_token"
  reason: "A pull-request-triggered job references repository secrets; fork-controlled code or event text may reach them."
  review_prompt: "Confirm whether fork pull requests can reach secret-using jobs; separate untrusted validation from secret-bearing jobs."
  positive_examples:
    - "if: github.event_name == 'pull_request' && secrets.NPM_TOKEN != ''"
  negative_examples:
    - "run: npm publish"
- id: env-secret-exposed-to-pull-request
  category: "secrets"
  severity_hint: "medium"
  confidence_hint: "low"
  cwe: "CWE-522"
  owasp: "A08:2025"
  asvs: "V13.3.2"
  globs:
    - "**/.github/workflows/*.yml"
    - "**/.github/workflows/*.yaml"
  patterns:
    - "env:"
  nearby_terms:
    - "SECRET"
    - "TOKEN"
    - "PASSWORD"
  reason: "A job-level env block may expose secret values to every step, including untrusted pull-request code and third-party actions."
  review_prompt: "Check which event triggers the job and whether fork code can read the env; move secrets to the steps that need them."
  positive_examples:
    - "env: { DEPLOY_TOKEN: secret-value }"
  negative_examples:
    - "env: { NODE_ENV: production }"
