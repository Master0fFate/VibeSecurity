- id: dynamic-query-construction
  category: injection
  severity_hint: high
  confidence_hint: medium
  cwe: "CWE-89"
  owasp: "A05:2025"
  asvs: "V1.2.4"
  globs:
    - "**/*.ts"
    - "**/*.js"
    - "**/*.py"
    - "**/*.go"
    - "**/*.rb"
    - "**/*.java"
    - "**/*.cs"
    - "**/*.php"
    - "**/*.rs"
    - "**/*.sql"
  patterns:
    - "$queryRawUnsafe("
    - "$executeRawUnsafe("
    - "db.raw("
    - "knex.raw("
    - "sequelize.query(`"
    - "FromSqlRaw("
    - "DB::raw("
    - "whereRaw("
    - "find_by_sql"
    - "sqlx::query("
    - ".extra("
  regex_patterns:
    - "(?i)(?:execute|query|raw|cursor\.execute|\.exec)\(\s*(?:f['\x22]|`[^`\n]*\$\{|['\x22][^'\x22\n]*['\x22]\s*\+\s*[A-Za-z_]|['\x22][^'\x22\n]*%s[^'\x22\n]*['\x22]\s*%)"
    - "(?i)['\x22`](?:select|insert|update|delete)\b[^'\x22`\n]*['\x22`]\s*\+\s*[A-Za-z_(]"
    - "(?i)`(?:select|insert|update|delete)\b[^`\n]*\$\{"
    - "(?i)f['\x22](?:select|insert|update|delete)\b[^'\x22\n]*\{"
    - "(?i)fmt\.Sprintf\(\s*['\x22](?:select|insert|update|delete)\b"
  exclude_patterns:
    - "$queryraw`"
    - "$executeraw`"
    - "sql`"
    - "sql.identifier("
    - "quote_ident("
    - "escape_string("
  reason: "A database query is assembled from string concatenation or interpolation instead of parameters."
  review_prompt: "Trace the interpolated values to their source; replace string construction with parameterized queries or a query builder."
  positive_examples:
    - "db.query(`SELECT * FROM users WHERE email = '${email}'`)"
    - "cursor.execute(f\"DELETE FROM orders WHERE id = {order_id}\")"
    - "const rows = await prisma.$queryRawUnsafe(\"SELECT * FROM t WHERE id = \" + id)"
  negative_examples:
    - "db.query(\"SELECT * FROM users WHERE email = $1\", [email])"
    - "cursor.execute(\"DELETE FROM orders WHERE id = %s\", (order_id,))"
    - "const rows = await prisma.$queryRaw`SELECT * FROM t WHERE id = ${id}`"
- id: nosql-query-from-request
  category: injection
  severity_hint: high
  confidence_hint: medium
  cwe: "CWE-943"
  owasp: "A05:2025"
  asvs: "V1.2.4, V2.2.2"
  globs:
    - "**/*.ts"
    - "**/*.js"
    - "**/*.py"
  patterns:
    - "$where"
    - "find(req.body"
    - "find(req.query"
    - "findone(req.body"
    - "findone(req.query"
    - "find({ ...req."
    - "findone({ ...req."
    - "where: req.body"
    - "where: req.query"
    - "find(request.json"
    - "find_one(request.json"
    - "find(request.args"
    - "find_one(request.args"
    - "find(await req.json()"
    - "findone(await req.json()"
  reason: "A NoSQL query object is built directly from request input, allowing operator injection such as $ne or $gt."
  review_prompt: "Validate and coerce each field to a scalar before it reaches the query; reject objects where strings are expected."
  positive_examples:
    - "const user = await User.findOne(req.body);"
    - "const docs = await Items.find({ ...req.query });"
  negative_examples:
    - "const user = await User.findOne({ email: String(req.body.email) });"
