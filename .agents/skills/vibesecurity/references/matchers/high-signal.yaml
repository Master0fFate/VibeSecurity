# VibeSecurity high-signal application matchers.
# Restricted YAML subset: one-line scalars and lists only.
# patterns / exclude_patterns / same_line_terms / nearby_terms / nearby_excludes are
# case-insensitive substrings. regex_patterns are Python regexes (case-sensitive
# unless they start with (?i)); backreferences and nested unbounded quantifiers are
# rejected by the loader. Every rule names its CWE, OWASP Top 10 2025 category, and
# ASVS 5.0.0 requirement ids (see references/standards/). Examples are synthetic and
# are run through the engine by the test suite.

- id: possible-secret-literal
  category: secrets
  severity_hint: high
  confidence_hint: medium
  cwe: "CWE-798"
  owasp: "A02:2025"
  asvs: "V13.3.1, V7.2.2"
  globs:
    - "**/*"
  regex_patterns:
    - "(?i)(?:api[_-]?key|apikey|client[_-]?secret|private[_-]?key|jwt[_-]?secret|secret[_-]?key|signing[_-]?secret|webhook[_-]?secret|auth[_-]?token|access[_-]?token|secret|password|passwd)\b\s*[:=]\s*(?:['\x22][^'\x22\n]{8,}['\x22]|[A-Za-z0-9_+/=-]{12,}(?=\s|$|[,;]))"
    - "BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY"
  exclude_patterns:
    - "process.env"
    - "os.environ"
    - "getenv("
    - "import.meta.env"
    - "${"
    - "your-"
    - "your_"
    - "<your"
    - "xxx"
    - "changeme"
    - "placeholder"
    - "example"
    - "redacted"
    - "***"
    - "dummy"
    - "replace_me"
    - "replace-me"
    - "todo"
    - "secrets."
    - "vault"
    - "parameterstore"
    - "secretsmanager"
  reason: "A secret-named variable is assigned a literal value instead of a runtime reference."
  review_prompt: "Confirm whether the value is real, exposed, and requires rotation without printing it; move it to a secret store."
  positive_examples:
    - "api_key = \"sk-notreal-12345678901234567890\""
    - "const stripeSecret = { secret_key: 'live_key_value_1234567890' }"
    - "DATABASE_PASSWORD=correcthorsebatterystaple"
  negative_examples:
    - "api_key = os.environ[\"API_KEY\"]"
    - "const apiKey = process.env.OPENAI_API_KEY;"
    - "password: your-password-here"
    - "api_key: str"
