  review_prompt: "Revoke the token in Vault and audit secrets read with it."
- id: terraform-cloud-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\b[A-Za-z0-9]{14}\.atlasv1\.[A-Za-z0-9_=-]{60,70}\b"
  description: "HashiCorp Terraform Cloud user or team API token (atlasv1 marker)."
  review_prompt: "Revoke the token in Terraform Cloud user settings and rotate."
- id: cloudflare-origin-ca-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\bv1\.0-[a-f0-9]{24}-[a-f0-9]{146}\b"
