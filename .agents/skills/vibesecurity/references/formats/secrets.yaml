# ---------------------------------------------------------------- cloud and infra
- id: aws-access-key-id
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\b(?:AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16}\b"
  description: "AWS access key id (AKIA long-term, ASIA temporary, ABIA and ACCA service prefixes)."
  review_prompt: "Confirm the identifier is active without printing it; deactivate it in IAM and rotate."
- id: aws-secret-access-key
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "medium"
  source: "observed"
  regex: "(?i)aws_secret_access_key[\x22']?\s*[:=]\s*[\x22']?[A-Za-z0-9/+=]{40}(?![A-Za-z0-9/+=])"
  description: "AWS secret access key assigned next to its documented variable name (40-character base64)."
  review_prompt: "Deactivate the access key pair in IAM immediately and audit CloudTrail for use."
- id: azure-storage-account-key
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "AccountKey=[A-Za-z0-9+/]{86}=="
  description: "Azure Storage account key inside a connection string (88-character base64 AccountKey)."
  review_prompt: "Regenerate the storage account key in the Azure portal and update every connection string."
- id: azure-ad-client-secret
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "medium"
  source: "gitleaks-default-config"
  regex: "(?:^|[^A-Za-z0-9_~.-])[A-Za-z0-9_~.]{3}\dQ~[A-Za-z0-9_~.-]{31,34}(?![A-Za-z0-9_~.-])"
  description: "Microsoft Entra ID (Azure AD) application client secret (Q~ marker shape)."
  review_prompt: "Delete the client secret in Entra app registrations and issue a new one."
- id: gcp-service-account-json
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "[\x22']type[\x22']\s*:\s*[\x22']service_account[\x22']"
  description: "Google Cloud or Firebase service account key file (JSON with type service_account and an embedded private key)."
  review_prompt: "Delete the service account key in IAM and rotate; service accounts often bypass Firebase security rules."
- id: alibaba-access-key-id
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\bLTAI[A-Za-z0-9]{20}\b"
  description: "Alibaba Cloud AccessKey ID (LTAI prefix)."
  review_prompt: "Disable the AccessKey in the Alibaba Cloud RAM console and rotate."
- id: digitalocean-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\bdo[por]_v1_[a-f0-9]{64}\b"
  description: "DigitalOcean personal access, OAuth access, or refresh token (dop_v1_, doo_v1_, dor_v1_)."
  review_prompt: "Revoke the token in the DigitalOcean API settings and rotate."
- id: flyio-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\b(?:fo1_[A-Za-z0-9_-]{43}|fm2_[A-Za-z0-9+/]{100,}={0,3})"
  description: "Fly.io access token (fo1_ or fm2_ prefix)."
  review_prompt: "Revoke the token with flyctl tokens revoke and rotate."
- id: hashicorp-vault-token
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\bhv[sb]\.[A-Za-z0-9_-]{90,}"
