# VibeSecurity secret token formats.
# Restricted subset: one-line scalar fields only; regexes are double-quoted and
# must not contain double-quote characters (use \x22 inside a regex instead).
# Formats are evaluated top to bottom; a later format never fires on a span an
# earlier format already claimed, so specific prefixes sit above generic shapes.
#
# source values:
#   vendor-doc              the vendor documents this exact prefix or shape
#   gitleaks-default-config pattern family catalogued in the Gitleaks default
#                           config (MIT, https://github.com/gitleaks/gitleaks)
#   observed                prefix seen consistently in the wild but not found
#                           in vendor documentation; confidence is medium
#
# No real secrets appear here or in fixtures. Examples are synthetic and inert.

# ---------------------------------------------------------------- AI providers
- id: anthropic-admin-api-key
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\bsk-ant-admin01-[A-Za-z0-9_-]{40,}\b"
  description: "Anthropic Admin API key (sk-ant-admin01- prefix); grants organization administration."
  review_prompt: "Revoke in the Anthropic Console admin keys page and rotate; audit organization changes."
- id: anthropic-api-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\bsk-ant-api03-[A-Za-z0-9_-]{40,}\b"
  description: "Anthropic API key (sk-ant-api03- prefix)."
  review_prompt: "Confirm the key is real without printing it; revoke it in the Anthropic Console and rotate."
- id: openai-api-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,}T3BlbkFJ[A-Za-z0-9_-]{20,}\b|\bsk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}\b"
  description: "OpenAI API key (project, service-account, admin, or user key carrying the T3BlbkFJ marker, which is base64 for OpenAI)."
  review_prompt: "Confirm the key is real without printing it; revoke it in the OpenAI dashboard and rotate."
- id: openrouter-api-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "medium"
  source: "observed"
  regex: "\bsk-or-v1-[a-f0-9]{64}\b"
