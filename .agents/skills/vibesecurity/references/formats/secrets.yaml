  regex: "\bsk-[A-Za-z0-9]{48}\b"
  description: "sk- prefixed 48-character key (legacy OpenAI shape, also issued by other vendors)."
  review_prompt: "Identify the issuing vendor from surrounding code, then revoke and rotate without printing the value."
- id: google-api-key
