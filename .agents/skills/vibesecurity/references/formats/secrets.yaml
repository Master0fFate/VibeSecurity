# ---------------------------------------------------------------- source and package platforms
- id: github-fine-grained-pat
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\bgithub_pat_[A-Za-z0-9_]{82}\b"
  description: "GitHub fine-grained personal access token (github_pat_ prefix, 93 characters)."
  review_prompt: "Revoke the token in GitHub developer settings and rotate."
- id: github-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\bgh[pousr]_[A-Za-z0-9]{36}\b"
  description: "GitHub token (ghp_ classic PAT, gho_ OAuth, ghu_ user-to-server, ghs_ server-to-server, ghr_ refresh)."
  review_prompt: "Revoke the token in GitHub settings or the app installation and rotate."
- id: gitlab-pat
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
