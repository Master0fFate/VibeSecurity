# VibeSecurity secret token formats.
# Restricted subset: one-line scalar fields only; regexes are double-quoted and
# must not contain double-quote characters. Every format below matches a token
# family documented by its vendor. No real secrets appear here or in fixtures.
# positive/negative examples are synthetic and inert.

- id: aws-access-key-id
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bAKIA[0-9A-Z]{16}\b"
  description: "AWS access key id format (documented AKIA-prefixed identifier)."
  review_prompt: "Confirm the identifier is real and active without printing it; plan rotation and key hygiene."
  positive_examples:
    - "aws_access_key_id = AKIAIOSFODNN7EXAMPLE"
  negative_examples:
    - "aws_access_key_id = AKIAPLACEHOLDER"
- id: github-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bgh[pousr]_[A-Za-z0-9]{20,}\b"
  description: "GitHub token format (documented ghp/gho/ghu/ghs/ghr prefixes)."
  review_prompt: "Confirm the token is real without printing it; revoke and rotate if committed."
  positive_examples:
    - "token = ghp_0123456789abcdefghijklmnopqrstuv"
  negative_examples:
    - "token = ghp_short"
- id: github-fine-grained-pat
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bgithub_pat_[A-Za-z0-9_]{20,}\b"
  description: "GitHub fine-grained personal access token format."
  review_prompt: "Confirm the token is real without printing it; revoke and rotate if committed."
  positive_examples:
    - "auth = github_pat_11ABCDEFG0123456789_abcdefghijklmnopqrstuvwxyz"
  negative_examples:
    - "auth = github_pat_short"
- id: gitlab-pat
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bglpat-[A-Za-z0-9_-]{16,}\b"
  description: "GitLab personal access token format (documented glpat- prefix)."
  review_prompt: "Confirm the token is real without printing it; revoke and rotate if committed."
  positive_examples:
    - "private_token: glpat-0123456789abcdefghij"
  negative_examples:
    - "private_token: glpat-short"
- id: slack-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bxox[baprs]-[A-Za-z0-9-]{10,}\b"
  description: "Slack token format (documented xoxb/xoxa/xoxp/xoxr/xoxs prefixes)."
  review_prompt: "Confirm the token is real without printing it; revoke via the Slack app settings."
  positive_examples:
    - "slack_token = xoxb-0123456789abcdefghi"
  negative_examples:
    - "slack_token = xoxb-tiny"
- id: openai-api-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b"
  description: "OpenAI API key format (documented sk- and sk-proj- prefixes)."
  review_prompt: "Confirm the key is real without printing it; revoke and rotate if committed."
  positive_examples:
    - "api_key = sk-proj0123456789abcdefghijklmnopqrstuv"
  negative_examples:
    - "api_key = sk-small"
- id: anthropic-api-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bsk-ant-api03-[A-Za-z0-9_-]{20,}\b"
  description: "Anthropic API key format (documented sk-ant-api03- prefix)."
  review_prompt: "Confirm the key is real without printing it; revoke and rotate if committed."
  positive_examples:
    - "key: sk-ant-api03-0123456789abcdefghijklmnopqrstuv"
  negative_examples:
    - "key: sk-ant-api03-tiny"
- id: google-api-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bAIza[0-9A-Za-z_-]{30,}\b"
  description: "Google API key format (documented AIza prefix)."
  review_prompt: "Confirm the key is real without printing it; rotate and restrict it in the cloud console."
  positive_examples:
    - "google_api_key = AIza0123456789abcdefghijklmnopqrstuvw"
  negative_examples:
    - "google_api_key = AIzaShort"
- id: stripe-secret-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bsk_live_[0-9A-Za-z]{16,}\b"
  description: "Stripe secret key format (documented sk_live_ prefix)."
  review_prompt: "Confirm the key is live without printing it; roll it from the Stripe dashboard."
  positive_examples: []
  negative_examples:
    - "stripe_key = sk_test_tiny"
- id: npm-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bnpm_[A-Za-z0-9]{32,}\b"
  description: "npm automation/access token format (documented npm_ prefix)."
  review_prompt: "Confirm the token is real without printing it; revoke it in npm access tokens."
  positive_examples:
    - "NODE_AUTH_TOKEN=npm_0123456789abcdefghijklmnopqrstuvwx"
  negative_examples:
    - "NODE_AUTH_TOKEN=npm_short"
- id: pypi-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{32,}\b"
  description: "PyPI API token format (documented pypi-AgEIcHlwaS5vcmc prefix)."
  review_prompt: "Confirm the token is real without printing it; revoke it on pypi.org."
  positive_examples:
    - "password = pypi-AgEIcHlwaS5vcmc0123456789abcdefghijklmnopqrstuvwxyz"
  negative_examples:
    - "password = pypi-token-placeholder"
- id: sendgrid-api-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bSG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\b"
  description: "SendGrid API key format (documented SG.prefix.suffix structure)."
  review_prompt: "Confirm the key is real without printing it; revoke it in SendGrid settings."
  positive_examples:
    - "sendgrid_key: SG.0123456789abcdef.0123456789abcdefghijklmnop"
  negative_examples:
    - "sendgrid_key: SG.short.short"
- id: twilio-api-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\bSK[0-9a-f]{32}\b"
  description: "Twilio API key format (documented SK prefix with 32 hex characters)."
  review_prompt: "Confirm the key is real without printing it; revoke it in the Twilio console."
  positive_examples:
    - "twilio_key = SK0123456789abcdef0123456789abcdef01234567"
  negative_examples:
    - "twilio_key = SK0123456789abcdef"
- id: private-key-block
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "high"
  regex: "-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |)?PRIVATE KEY-----"
  description: "PEM private key header."
  review_prompt: "Confirm whether real key material follows the header without printing it; rotate the key."
  positive_examples:
    - "-----BEGIN RSA PRIVATE KEY-----"
  negative_examples:
    - "-----BEGIN PUBLIC KEY-----"
- id: jwt-token
  category: "secrets"
  severity_hint: "medium"
  confidence_hint: "high"
  regex: "\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b"
  description: "JSON Web Token (three dot-separated base64url segments)."
  review_prompt: "Confirm whether the JWT is a real credential rather than a test fixture, without printing it."
  positive_examples:
    - "session: eyJhbGciOi.eyJzdWIiOi.c2lnbmF0dXJl"
  negative_examples:
    - "session: not-a-jwt"
- id: url-embedded-credentials
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  regex: "\b[a-z][a-z0-9+.-]*://[^/\s:@]+:[^@\s/]+@"
  description: "URL with embedded username and password (RFC 3986 userinfo)."
  review_prompt: "Confirm whether the credentials are real without printing them; move them to a secret manager."
  positive_examples:
    - "db = postgres://admin:hunter2secret@example.internal/db"
  negative_examples:
    - "db = postgres://example.internal/db"
- id: database-connection-url
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "medium"
  regex: "\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|amqp)://[^\s<>]+"
  description: "Database or broker connection URL, often carrying credentials."
  review_prompt: "Check the URL for embedded credentials without printing them; rotate any exposed password."
  positive_examples:
    - "url = postgresql://user:secret@db.internal:5432/app"
  negative_examples:
    - "url = postgresql://db.internal:5432/app"
