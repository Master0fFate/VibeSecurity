# ---------------------------------------------------------------- generic structures
- id: private-key-block
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP |)?PRIVATE KEY(?: BLOCK)?-----"
  description: "PEM or PGP private key header."
  review_prompt: "Confirm whether real key material follows the header without printing it; rotate the key."
- id: putty-private-key
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "PuTTY-User-Key-File-[0-9]:"
  description: "PuTTY private key file (.ppk) header."
  review_prompt: "Rotate the SSH key pair and remove the file from history."
- id: authorization-bearer-literal
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "medium"
  source: "observed"
  regex: "(?i)authorization[\x22']?\s*[:=]\s*[\x22']?bearer\s+(?![$<{%])[A-Za-z0-9._~+/=-]{20,}"
  description: "Authorization header with a literal bearer token (not an environment reference or placeholder)."
  review_prompt: "Identify the token issuer and revoke; replace with runtime injection from a secret store."
- id: jwt-token
  category: "secrets"
  severity_hint: "medium"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b"
  description: "JSON Web Token (three dot-separated base64url segments, RFC 7519)."
  review_prompt: "Confirm whether the JWT is a real credential rather than a test fixture, without printing it; check expiry and audience."
- id: url-embedded-credentials
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\b[a-z][a-z0-9+.-]*://[^/\s:@]+:[^@\s/]+@"
  description: "URL with embedded username and password (RFC 3986 userinfo)."
  review_prompt: "Confirm whether the credentials are real without printing them; move them to a secret manager."
- id: database-connection-url
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "medium"
  source: "vendor-doc"
  regex: "\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqp|amqps|mssql|clickhouse|libsql)://[^\s<>]*[?&](?:password|passwd|pwd|sslkey|authToken)=[^\s<>&]+"
  description: "Database or broker connection URL carrying a password or key in its query string."
  review_prompt: "Rotate the password; move credentials to a secret manager and reference them at runtime."
