  regex: "\bglpat-[A-Za-z0-9_-]{20,}(?:\.[a-z0-9]{2}[a-z0-9]{7})?\b"
  description: "GitLab personal access token (glpat- prefix, including the routable form)."
  review_prompt: "Revoke the token in GitLab access tokens and rotate."
- id: gitlab-platform-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\bgl(?:rt|dt|cbt|ptt|ft|soat|agent|oas|imt|rrt|scim|ffct)-[A-Za-z0-9_-]{20,}\b"
  description: "GitLab runner, deploy, CI job, pipeline trigger, feed, OAuth, agent, SCIM, or feature-flag token."
  review_prompt: "Revoke the token in the relevant GitLab settings page and rotate."
- id: npm-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\bnpm_[A-Za-z0-9]{36}\b"
  description: "npm access token (npm_ prefix); grants publish rights for the account."
  review_prompt: "Revoke the token in npm access tokens; check for unexpected publishes."
- id: pypi-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,}"
  description: "PyPI API token (macaroon beginning pypi-AgEIcHlwaS5vcmc, base64 for pypi.org)."
  review_prompt: "Revoke the token on pypi.org; check for unexpected releases."
- id: rubygems-api-key
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\brubygems_[a-f0-9]{48}\b"
  description: "RubyGems API key (rubygems_ prefix)."
  review_prompt: "Revoke the key in RubyGems API keys."
- id: atlassian-api-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "gitleaks-default-config"
  regex: "\bATATT3[A-Za-z0-9_=-]{186}\b"
  description: "Atlassian API token (ATATT3 prefix) for Jira, Confluence, and Bitbucket Cloud."
  review_prompt: "Revoke the token in Atlassian account security settings."

# ---------------------------------------------------------------- app platforms used by vibe-coded apps
- id: supabase-service-role-jwt
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*(?:InJvbGUiOiJzZXJ2aWNlX3JvbGUi|Jyb2xlIjoic2VydmljZV9yb2xlI|icm9sZSI6InNlcnZpY2Vfcm9sZ)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+"
  description: "Supabase legacy service_role key (JWT whose payload carries role service_role); bypasses Row Level Security."
  review_prompt: "Rotate the JWT secret or migrate to sb_secret_ keys in the Supabase dashboard; this key must never reach a browser bundle."
- id: supabase-anon-jwt
  category: "secrets"
  severity_hint: "info"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*(?:InJvbGUiOiJhbm9uI|Jyb2xlIjoiYW5vb|icm9sZSI6ImFub24i)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+"
  description: "Supabase legacy anon key (JWT with role anon); public by design, safe only when Row Level Security is enabled on every table."
  review_prompt: "Do not rotate for exposure alone; verify every table has RLS enabled with policies that scope rows to the caller."
- id: supabase-secret-key
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\bsb_secret_[A-Za-z0-9_-]{20,}\b"
  description: "Supabase secret API key (sb_secret_ prefix); full data access that bypasses Row Level Security."
  review_prompt: "Revoke the key in Supabase project API settings; it must only live in server environments."
- id: supabase-publishable-key
  category: "secrets"
  severity_hint: "info"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\bsb_publishable_[A-Za-z0-9_-]{20,}\b"
  description: "Supabase publishable API key (sb_publishable_ prefix); public by design, relies on Row Level Security."
  review_prompt: "No rotation needed for exposure; verify RLS policies instead."
- id: supabase-personal-access-token
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "medium"
  source: "observed"
  regex: "\bsbp_[a-f0-9]{40}\b"
  description: "Supabase personal access token (sbp_ prefix) for the management API."
  review_prompt: "Revoke the token in Supabase account access tokens."
- id: stripe-or-clerk-live-secret-key
  category: "secrets"
  severity_hint: "critical"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\b(?:sk|rk)_(?:live|prod)_[A-Za-z0-9]{10,99}\b"
  description: "Live-mode secret key: Stripe secret (sk_live_) or restricted (rk_live_) key, or Clerk production secret key (sk_live_)."
  review_prompt: "Roll the key in the Stripe or Clerk dashboard immediately; live keys move money or mint sessions."
- id: stripe-or-clerk-test-secret-key
  category: "secrets"
  severity_hint: "medium"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\b(?:sk|rk)_test_[A-Za-z0-9]{10,99}\b"
  description: "Test-mode secret key for Stripe (sk_test_, rk_test_) or a Clerk development instance (sk_test_)."
  review_prompt: "Roll the test key; test-mode data and development auth instances are still private."
- id: stripe-webhook-secret
  category: "secrets"
  severity_hint: "high"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\bwhsec_[A-Za-z0-9]{32,}\b"
  description: "Stripe webhook signing secret (whsec_ prefix); lets an attacker forge payment events."
  review_prompt: "Roll the endpoint secret in the Stripe webhooks dashboard and redeploy."
- id: stripe-or-clerk-publishable-key
  category: "secrets"
  severity_hint: "info"
  confidence_hint: "high"
  source: "vendor-doc"
  regex: "\bpk_(?:live|test)_[A-Za-z0-9]{10,99}\b"
  description: "Publishable key (Stripe or Clerk); public by design."
  review_prompt: "No rotation needed for exposure; confirm the matching secret key is not nearby."
- id: resend-api-key
